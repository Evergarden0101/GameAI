# roller_config.yaml — PPO training (pure reinforcement learning)
# Run:  mlagents-learn config/roller_config.yaml --run-id=roller01
# then press Play in the Unity Editor. Add human feedback live with + / - (see README).
behaviors:
  RollerBall:                     # must match BehaviorParameters.BehaviorName
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 500000
    time_horizon: 64
    summary_freq: 10000
