# roller_imitation_config.yaml — learn from HUMAN DEMONSTRATIONS (imitation learning)
# ------------------------------------------------------------------------------------
# The other form of human input during training: instead of shaping reward live, you
# RECORD yourself playing and the trainer learns to imitate you.
#
# 1) Add a Demonstration Recorder component to the agent, tick "Record", set a name,
#    set Behavior Type = "Heuristic Only", press Play and drive with WASD for a while.
#    (Component: Unity.MLAgents.Demonstrations.DemonstrationRecorder — see README.)
# 2) It writes Assets/Demonstrations/RollerBall.demo
# 3) Train with this config, which adds Behavioral Cloning (BC) + GAIL on top of PPO:
#      mlagents-learn config/roller_imitation_config.yaml --run-id=roller_imit01
#
# BC copies your actions directly; GAIL rewards the agent for looking human — together
# they bootstrap learning far faster than reward alone on sparse tasks.
behaviors:
  RollerBall:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      gail:                        # reward the agent for behaving like the demos
        gamma: 0.99
        strength: 0.5
        demo_path: Assets/Demonstrations/RollerBall.demo
    behavioral_cloning:            # directly imitate the demos early in training
      demo_path: Assets/Demonstrations/RollerBall.demo
      strength: 0.5
      steps: 50000
    max_steps: 500000
    time_horizon: 64
    summary_freq: 10000
